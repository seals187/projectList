name: projectlist

services:
  projectlist:
    # Fertiges Image von GitHub (amd64/arm64): `docker compose up -d` lädt es herunter.
    # Andere Version: PROJECTLIST_TAG=0.0.2 docker compose up -d
    image: ghcr.io/seals187/projectlist:${PROJECTLIST_TAG:-latest}
    # Selbst aus dem Quellcode bauen: `docker compose build` (ersetzt das Image lokal)
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.0.2} # Versionsnummer im Binary (projectlist version, Log beim Start)
    container_name: projectlist
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/projectlist.db
      LISTEN_ADDR: ":8080"
      # Weiches Speicherlimit für die Go-Runtime (GC arbeitet aggressiver darunter).
      GOMEMLIMIT: 64MiB
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - projectlist-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/projectlist", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  projectlist-data:
