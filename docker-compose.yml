# Fixed project name: keeps the volume name (projectlist_projectlist-data) independent of the folder name
name: projectlist

services:
  projectlist:
    # Version via PROJECTLIST_VERSION in .env (latest = newest release, edge = development state)
    image: ghcr.io/seals187/projectlist:${PROJECTLIST_VERSION:-latest}
    container_name: projectlist
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/projectlist.db
      LISTEN_ADDR: ":8080"
      # Soft memory limit for the Go runtime (GC works harder below it)
      GOMEMLIMIT: 64MiB
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - projectlist-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/projectlist", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # SQLite database and backups (do not rename: existing data lives in this volume)
  projectlist-data:
