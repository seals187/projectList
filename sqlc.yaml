version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_empty_slices: true
        emit_interface: false
        overrides:
          - column: "checklist_items.due_date"
            go_type:
              type: "string"
              pointer: true
          - column: "checklist_items.assignee_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "checklist_items.done_by"
            go_type:
              type: "int64"
              pointer: true
          - column: "checklist_items.done_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "checklists.template_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "checklists.assignee_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "projects.due_date"
            go_type:
              type: "string"
              pointer: true
          - column: "project_activity.user_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "backgrounds.uploaded_by"
            go_type:
              type: "int64"
              pointer: true
          - column: "project_files.uploaded_by"
            go_type:
              type: "int64"
              pointer: true
          - column: "projects.start_date"
            go_type:
              type: "string"
              pointer: true
          - column: "projects.owner_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "users.last_seen_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "users.invited_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
