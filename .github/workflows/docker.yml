# CI and container image
#
# - Pull request: tests (go vet, go test, frontend build) inside the Docker build.
# - Push to main: tests, then publish the development state as :edge.
# - Tag v* (e.g. v0.0.2): build the image for linux/amd64 and linux/arm64 and push it to
#   ghcr.io/<owner>/projectlist – tags :0.0.2, :0.0 and :latest.
# - Manually (Actions → "CI and container image" → Run workflow): publish an existing
#   tag afterwards, e.g. v0.0.1.
name: CI and container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish as an image (e.g. v0.0.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: go vet, go test and frontend build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Publish image
    needs: test
    # on main (:edge), tags v* and manual runs; needs.test is skipped on manual runs
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine version
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" == v* ]] || TAG="v$TAG"   # accept "0.0.3" as well as "v0.0.3"
          image="ghcr.io/${OWNER,,}/projectlist"
          if [[ "$EVENT" != "workflow_dispatch" && "$REF" == "refs/heads/main" ]]; then
            {
              echo "ref=$SHA"
              echo "version=edge-${SHA::7}"
              echo "tags=$image:edge"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$TAG' is not a version of the form vX.Y.Z" >&2
            exit 1
          fi
          version="${TAG#v}"
          {
            echo "ref=refs/tags/$TAG"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.v.outputs.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
