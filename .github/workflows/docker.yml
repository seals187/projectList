# CI und Container-Image
#
# - Push auf main / Pull Request: Tests (go vet, go test, Frontend-Build) im Docker-Build.
# - Tag v* (z. B. v0.0.2): Image für linux/amd64 und linux/arm64 bauen und nach
#   ghcr.io/<owner>/projectlist pushen – Tags :0.0.2, :0.0 und :latest.
# - Manuell (Actions → „CI und Container-Image“ → Run workflow): ein bestehendes
#   Tag nachträglich veröffentlichen, z. B. v0.0.1.
name: CI und Container-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehendes Git-Tag, das als Image veröffentlicht werden soll (z. B. v0.0.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: go vet, go test und Frontend-Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Image veröffentlichen
    needs: test
    # bei Tags v* und manuellem Start; needs.test wird beim manuellen Start übersprungen
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Version bestimmen
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$TAG' ist keine Version der Form vX.Y.Z" >&2
            exit 1
          fi
          version="${TAG#v}"
          image="ghcr.io/${OWNER,,}/projectlist"
          {
            echo "ref=refs/tags/$TAG"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und pushen (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
